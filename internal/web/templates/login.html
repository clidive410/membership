{{define "content"}}
<h1>Sign in</h1>
{{if .P}}
<p>You are signed in as {{.P.Email}}, but your account has no access to the committee pages.</p>
{{else}}
{{with .Data.Error}}<p class="error" role="alert">{{.}}</p>{{end}}
<form method="post" action="{{url "/login"}}" class="narrow">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <p><label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required value="{{.Data.Email}}"></p>
  <p><label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required></p>
  <p><button type="submit">Sign in</button></p>
</form>
<p class="hint">Committee access only. Ask the membership secretary if you need an account.</p>
{{end}}
{{end}}
